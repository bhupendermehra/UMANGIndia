<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UmangIndia — Project Progress</title>
<style>
  :root{--bg:#05070b;--panel:#0b111a;--line:#1c2536;--txt:#eaf0ff;--dim:#7d8aa3;--blue:#38bdf8;--green:#20e3a2;--amber:#ffc857;--red:#ff4d6d}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;padding:24px;max-width:1000px;margin:0 auto}
  h1{font-size:22px;letter-spacing:-0.02em}
  .sub{color:var(--dim);font-size:12px;margin-top:4px}
  .overall{display:flex;align-items:center;gap:16px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin:20px 0}
  .ring{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;position:relative}
  .ring b{position:relative;z-index:2}
  .goal{flex:1}
  .goal h2{font-size:15px}
  .goal p{color:var(--dim);font-size:12px;margin-top:4px}
  .chip{display:inline-block;background:rgba(56,189,248,.12);color:var(--blue);border:1px solid rgba(56,189,248,.3);border-radius:999px;padding:3px 10px;font-size:11px;margin-top:8px}
  .phase{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:14px}
  .phase-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .phase-badge{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;background:#101826;border:1px solid var(--line)}
  .phase-badge.done{background:rgba(32,227,162,.15);border-color:rgba(32,227,162,.4);color:var(--green)}
  .phase-badge.active{background:rgba(56,189,248,.15);border-color:rgba(56,189,248,.4);color:var(--blue)}
  .phase-title{flex:1;font-weight:700;font-size:15px}
  .phase-pct{font-weight:800;font-size:14px;color:var(--dim)}
  .bar{height:6px;background:#101826;border-radius:99px;overflow:hidden;margin-bottom:14px}
  .bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--green));transition:width .5s}
  .tasks{display:grid;gap:6px}
  .task{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--dim)}
  .task input{margin:0}
  .task.on{color:var(--txt)}
  .task.on::after{content:"✓";color:var(--green);font-weight:800;margin-left:auto}
  .footer{color:var(--dim);font-size:11px;text-align:center;margin-top:24px}
</style>
</head>
<body>
  <h1>UmangIndia — Project Progress</h1>
  <div class="sub">UI overhaul + content depth + AdSense readiness · auto-updates from progress.json</div>

  <div class="overall">
    <div class="ring" id="ring"><b id="pct">0%</b></div>
    <div class="goal">
      <h2 id="goal">—</h2>
      <p id="updated">—</p>
      <span class="chip" id="adsense">—</span>
    </div>
  </div>

  <div id="phases"></div>
  <div class="footer">UmangIndia progress tracker · refresh to update</div>

<script>
fetch('progress.json').then(r=>r.json()).then(d=>{
  document.getElementById('pct').textContent = d.overall + '%';
  document.getElementById('goal').textContent = d.goal;
  document.getElementById('updated').textContent = 'Updated: ' + d.updated;
  document.getElementById('adsense').textContent = 'AdSense: ' + d.adsense_timeline;
  var ring = document.getElementById('ring');
  ring.style.background = 'conic-gradient(var(--green) ' + d.overall*3.6 + 'deg, #101826 0deg)';
  var ph = document.getElementById('phases');
  d.phases.forEach(p=>{
    var done = p.tasks.filter(t=>t.done).length, total = p.tasks.length;
    var cls = p.pct===100 ? 'done' : (p.pct>0 ? 'active' : '');
    var el = document.createElement('div'); el.className='phase';
    el.innerHTML = '<div class="phase-head"><div class="phase-badge '+cls+'">'+p.id+'</div>'+
      '<div class="phase-title">'+p.name+'</div><div class="phase-pct">'+p.pct+'%</div></div>'+
      '<div class="bar"><div class="bar-fill" style="width:'+p.pct+'%"></div></div>'+
      '<div class="tasks">'+p.tasks.map(t=>'<label class="task '+(t.done?'on':'')+'"><input type="checkbox" '+(t.done?'checked':'')+' disabled> '+t.name+'</label>').join('')+'</div>';
    ph.appendChild(el);
  });
});
</script>
</body>
</html>
